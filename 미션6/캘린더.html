<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니멀 활동 기록 캘린더</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --border-color: #ddd;
            --today-color: #ff4757;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .nav-controls button { background: none; border: 1px solid var(--border-color); border-radius: 5px; padding: 5px 10px; cursor: pointer; font-size: 16px; background-color: white; }
        .nav-controls button:hover { background-color: #eee; }
        .month-title { font-size: 24px; font-weight: bold; min-width: 150px; text-align: center; }
        
        .action-buttons { display: flex; gap: 8px; }
        .action-buttons button, .action-buttons label { background-color: white; border: 1px solid var(--border-color); border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
        .action-buttons button:hover, .action-buttons label:hover { background-color: #eee; }
        input[type="file"] { display: none; }

        .calendar-container { width: 100%; max-width: 800px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; margin-bottom: 10px; color: #666; }
        .weekdays div:first-child { color: #ff4757; } /* 일요일 */
        .weekdays div:last-child { color: #1e90ff; } /* 토요일 */
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .cell { aspect-ratio: 1 / 1.1; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s; background-color: white; }
        .cell:hover { transform: scale(1.02); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .cell.empty { background-color: transparent; border: none; cursor: default; }
        .cell.empty:hover { transform: none; box-shadow: none; }
        
        .date-num { font-size: 14px; font-weight: bold; margin-bottom: auto; }
        .date-num.today { color: white; background-color: var(--today-color); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; margin-top: -4px; margin-left: -4px; }
        
        .main-icon { font-size: 32px; text-align: center; line-height: 1; margin-bottom: 4px; }
        .sub-icons { display: flex; justify-content: center; gap: 2px; font-size: 14px; height: 16px; }

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal h2 { margin-top: 0; font-size: 20px; margin-bottom: 20px; text-align: center; }
        
        .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: #555; }
        .color-picker, .icon-picker { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
        
        .color-swatch { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.selected { border-color: #333; transform: scale(1.1); }
        
        .icon-swatch { font-size: 24px; cursor: pointer; padding: 5px; border-radius: 8px; border: 2px solid transparent; background: #f0f0f0; }
        .icon-swatch:hover { background: #e0e0e0; }
        
        .preview-area { background: #f9f9f9; border: 1px dashed #ccc; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 20px; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .preview-icons { font-size: 24px; letter-spacing: 5px; }
        .preview-desc { font-size: 12px; color: #888; margin-top: 5px; }

        .modal-buttons { display: flex; justify-content: space-between; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-save { background-color: #4CAF50; color: white; }
        .btn-clear { background-color: #ff4757; color: white; }
        .btn-close { background-color: #ddd; color: #333; }
    </style>
</head>
<body>

    <div class="header">
        <div class="nav-controls">
            <button id="prevBtn">&lt;</button>
            <div class="month-title" id="monthTitle">2023년 10월</div>
            <button id="nextBtn">&gt;</button>
            <button id="viewToggleBtn">주간 뷰로 보기</button>
        </div>
        <div class="action-buttons">
            <button id="exportImgBtn">이미지 저장</button>
            <button id="exportJsonBtn">데이터 내보내기</button>
            <label for="importJsonInput">데이터 불러오기</label>
            <input type="file" id="importJsonInput" accept=".json">
        </div>
    </div>

    <div class="calendar-container">
        <div class="weekdays">
            <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
        </div>
        <div class="calendar-grid" id="calendarGrid">
            <!-- 달력 셀이 JS로 생성됩니다 -->
        </div>
    </div>

    <!-- 입력 모달 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalDateTitle">2023년 10월 1일</h2>
            
            <div class="section-title">배경 색상 선택</div>
            <div class="color-picker" id="colorPicker"></div>
            
            <div class="section-title">아이콘 선택 (최대 5개, 클릭하여 제거)</div>
            <div class="icon-picker" id="iconPicker"></div>
            
            <div class="preview-area" id="previewArea">
                <div class="preview-icons" id="previewIcons"></div>
                <div class="preview-desc">선택된 아이콘 (첫 번째가 메인)</div>
            </div>

            <div class="modal-buttons">
                <button class="btn-clear" id="clearBtn">클리어</button>
                <button class="btn-close" id="closeBtn">취소</button>
                <button class="btn-save" id="saveBtn">저장</button>
            </div>
        </div>
    </div>

    <script>
        // --- 기획서 데이터 ---
        const ICONS = ['🏃‍♂️', '📚', '💻', '☕', '🎉'];
        const COLORS = ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E6B3FF'];
        
        // --- 상태 관리 ---
        let currentDate = new Date();
        let viewMode = 'month'; // 'month' or 'week'
        let calendarData = JSON.parse(localStorage.getItem('minimalCalendarData')) || {};
        
        // 모달 상태
        let selectedDateStr = '';
        let tempColor = '';
        let tempIcons = [];

        // --- DOM 요소 ---
        const monthTitle = document.getElementById('monthTitle');
        const calendarGrid = document.getElementById('calendarGrid');
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const colorPicker = document.getElementById('colorPicker');
        const iconPicker = document.getElementById('iconPicker');
        const previewIcons = document.getElementById('previewIcons');
        const previewArea = document.getElementById('previewArea');

        // --- 초기화 ---
        function init() {
            setupModalUI();
            renderCalendar();
            setupEventListeners();
        }

        // --- 달력 렌더링 로직 ---
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const todayStr = getLocalYYYYMMDD(new Date());

            if (viewMode === 'month') {
                monthTitle.textContent = `${year}년 ${month + 1}월`;
                viewToggleBtn.textContent = '주간 뷰로 보기';
                
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // 빈 칸 채우기
                for (let i = 0; i < firstDay; i++) {
                    const emptyCell = document.createElement('div');
                    emptyCell.className = 'cell empty';
                    calendarGrid.appendChild(emptyCell);
                }

                // 날짜 채우기
                for (let i = 1; i <= daysInMonth; i++) {
                    const dateStr = getLocalYYYYMMDD(new Date(year, month, i));
                    calendarGrid.appendChild(createCell(i, dateStr, dateStr === todayStr));
                }
            } else {
                // 주간 뷰
                viewToggleBtn.textContent = '월간 뷰로 보기';
                
                // 현재 날짜가 포함된 주의 일요일 찾기
                const currentDayOfWeek = currentDate.getDay();
                const sunday = new Date(currentDate);
                sunday.setDate(currentDate.getDate() - currentDayOfWeek);

                // 주간 타이틀 설정 (일요일 기준 달)
                monthTitle.textContent = `${sunday.getFullYear()}년 ${sunday.getMonth() + 1}월 (주간)`;

                for (let i = 0; i < 7; i++) {
                    const d = new Date(sunday);
                    d.setDate(sunday.getDate() + i);
                    const dateStr = getLocalYYYYMMDD(d);
                    calendarGrid.appendChild(createCell(d.getDate(), dateStr, dateStr === todayStr));
                }
            }
        }

        function createCell(dayNum, dateStr, isToday) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.date = dateStr;
            
            const numDiv = document.createElement('div');
            numDiv.className = `date-num ${isToday ? 'today' : ''}`;
            numDiv.textContent = dayNum;
            cell.appendChild(numDiv);

            const data = calendarData[dateStr];
            if (data) {
                if (data.color) cell.style.backgroundColor = data.color;
                
                if (data.icons && data.icons.length > 0) {
                    const mainIcon = document.createElement('div');
                    mainIcon.className = 'main-icon';
                    mainIcon.textContent = data.icons[0];
                    cell.appendChild(mainIcon);

                    if (data.icons.length > 1) {
                        const subIcons = document.createElement('div');
                        subIcons.className = 'sub-icons';
                        for (let i = 1; i < data.icons.length; i++) {
                            const span = document.createElement('span');
                            span.textContent = data.icons[i];
                            subIcons.appendChild(span);
                        }
                        cell.appendChild(subIcons);
                    }
                }
            }

            cell.addEventListener('click', () => openModal(dateStr));
            return cell;
        }

        // --- 모달 로직 ---
        function setupModalUI() {
            // 색상 스와치 생성
            COLORS.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.addEventListener('click', () => selectColor(color, swatch));
                colorPicker.appendChild(swatch);
            });

            // 아이콘 스와치 생성
            ICONS.forEach(icon => {
                const swatch = document.createElement('div');
                swatch.className = 'icon-swatch';
                swatch.textContent = icon;
                swatch.addEventListener('click', () => addIcon(icon));
                iconPicker.appendChild(swatch);
            });
        }

        function openModal(dateStr) {
            selectedDateStr = dateStr;
            const [y, m, d] = dateStr.split('-');
            document.getElementById('modalDateTitle').textContent = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일 기록`;
            
            // 기존 데이터 불러오기
            const data = calendarData[dateStr] || { color: '', icons: [] };
            tempColor = data.color;
            tempIcons = [...(data.icons || [])];
            
            updateModalPreview();
            modalOverlay.style.display = 'flex';
        }

        function selectColor(color, swatchElement) {
            tempColor = tempColor === color ? '' : color; // 토글 기능
            updateModalPreview();
        }

        function addIcon(icon) {
            if (tempIcons.length >= 5) {
                alert('아이콘은 최대 5개까지만 선택할 수 있습니다.');
                return;
            }
            tempIcons.push(icon);
            updateModalPreview();
        }

        function removeIcon(index) {
            tempIcons.splice(index, 1);
            updateModalPreview();
        }

        function updateModalPreview() {
            // 색상 UI 업데이트
            document.querySelectorAll('.color-swatch').forEach(el => {
                el.classList.toggle('selected', el.style.backgroundColor === hexToRgb(tempColor));
            });
            previewArea.style.backgroundColor = tempColor || '#f9f9f9';

            // 아이콘 UI 업데이트
            previewIcons.innerHTML = '';
            tempIcons.forEach((icon, index) => {
                const span = document.createElement('span');
                span.textContent = icon;
                span.style.cursor = 'pointer';
                span.title = '클릭하여 제거';
                // 첫 번째 아이콘(메인)은 크게 표시
                if(index === 0) span.style.fontSize = '32px';
                else span.style.fontSize = '20px';
                
                span.addEventListener('click', () => removeIcon(index));
                previewIcons.appendChild(span);
            });
        }

        function saveRecord() {
            if (!tempColor && tempIcons.length === 0) {
                delete calendarData[selectedDateStr];
            } else {
                calendarData[selectedDateStr] = { color: tempColor, icons: tempIcons };
            }
            saveToLocalStorage();
            closeModal();
            renderCalendar();
        }

        function clearRecord() {
            delete calendarData[selectedDateStr];
            saveToLocalStorage();
            closeModal();
            renderCalendar();
        }

        function closeModal() {
            modalOverlay.style.display = 'none';
        }

        // --- 유틸리티 및 이벤트 ---
        function saveToLocalStorage() {
            localStorage.setItem('minimalCalendarData', JSON.stringify(calendarData));
        }

        function getLocalYYYYMMDD(date) {
            const tzoffset = date.getTimezoneOffset() * 60000;
            return (new Date(date - tzoffset)).toISOString().split('T')[0];
        }

        function hexToRgb(hex) {
            if (!hex) return '';
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function setupEventListeners() {
            document.getElementById('prevBtn').addEventListener('click', () => {
                if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
                else currentDate.setDate(currentDate.getDate() - 7);
                renderCalendar();
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
                else currentDate.setDate(currentDate.getDate() + 7);
                renderCalendar();
            });

            viewToggleBtn.addEventListener('click', () => {
                viewMode = viewMode === 'month' ? 'week' : 'month';
                renderCalendar();
            });

            document.getElementById('closeBtn').addEventListener('click', closeModal);
            document.getElementById('saveBtn').addEventListener('click', saveRecord);
            document.getElementById('clearBtn').addEventListener('click', clearRecord);

            // JSON 내보내기
            document.getElementById('exportJsonBtn').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(calendarData));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "calendar_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            });

            // JSON 불러오기
            document.getElementById('importJsonInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        calendarData = importedData;
                        saveToLocalStorage();
                        renderCalendar();
                        alert('데이터를 성공적으로 불러왔습니다.');
                    } catch (err) {
                        alert('잘못된 파일 형식입니다.');
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // 초기화
            });

            // 외부 라이브러리 없는 순수 Canvas 이미지 저장 로직
            document.getElementById('exportImgBtn').addEventListener('click', exportToImage);
        }

        // --- 이미지 저장 (Vanilla JS Canvas) ---
        function exportToImage() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 캔버스 크기 설정
            const cols = 7;
            const rows = viewMode === 'month' ? Math.ceil(calendarGrid.children.length / 7) : 1;
            const cellWidth = 100;
            const cellHeight = 110;
            const headerHeight = 50;
            const padding = 20;
            
            canvas.width = (cols * cellWidth) + (padding * 2);
            canvas.height = (rows * cellHeight) + headerHeight + (padding * 2);
            
            // 배경 흰색
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 요일 헤더 그리기
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            weekdays.forEach((day, i) => {
                if (i === 0) ctx.fillStyle = '#ff4757';
                else if (i === 6) ctx.fillStyle = '#1e90ff';
                else ctx.fillStyle = '#666666';
                
                const x = padding + (i * cellWidth) + (cellWidth / 2);
                const y = padding + (headerHeight / 2);
                ctx.fillText(day, x, y);
            });

            // 셀 그리기
            const cells = calendarGrid.children;
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                const col = i % 7;
                const row = Math.floor(i / 7);
                
                const x = padding + (col * cellWidth);
                const y = padding + headerHeight + (row * cellHeight);
                
                // 빈 셀 스킵
                if (cell.classList.contains('empty')) continue;

                // 배경색
                const dateStr = cell.dataset.date;
                const data = calendarData[dateStr];
                if (data && data.color) {
                    ctx.fillStyle = data.color;
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, cellWidth - 4, cellHeight - 4, 8);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#dddddd';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, cellWidth - 4, cellHeight - 4, 8);
                    ctx.stroke();
                }

                // 날짜 숫자
                const dayNum = cell.querySelector('.date-num').textContent;
                const isToday = cell.querySelector('.date-num').classList.contains('today');
                
                if (isToday) {
                    ctx.fillStyle = '#ff4757';
                    ctx.beginPath();
                    ctx.arc(x + 16, y + 16, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#333333';
                }
                
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(dayNum, x + 10, y + 16);

                // 아이콘 그리기
                if (data && data.icons && data.icons.length > 0) {
                    ctx.textAlign = 'center';
                    
                    // 메인 아이콘
                    ctx.font = '32px sans-serif';
                    ctx.fillText(data.icons[0], x + (cellWidth / 2), y + 60);
                    
                    // 서브 아이콘
                    if (data.icons.length > 1) {
                        ctx.font = '14px sans-serif';
                        const subIconsStr = data.icons.slice(1).join(' ');
                        ctx.fillText(subIconsStr, x + (cellWidth / 2), y + 90);
                    }
                }
            }

            // 다운로드 트리거
            const link = document.createElement('a');
            link.download = `calendar_${viewMode}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 앱 시작
        init();
    </script>
</body>
</html>
